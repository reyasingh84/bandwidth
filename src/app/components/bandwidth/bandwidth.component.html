<div class="app-shell border border-surface-200 dark:border-surface-700 rounded-lg overflow-hidden">
            <p-sidebar-layout class="app-layout relative!">
                @if (isMobile() && (navOpen() || open())) {
                    <p-sidebar-backdrop class="absolute!" />
                }
                <p-sidebar id="nav" side="left" [collapsible]="isMobile() ? 'offcanvas' : 'icon'" [overlay]="isMobile()" [(open)]="navOpen" width="14rem">
                    <p-sidebar-spacer />
                    <p-sidebar-aside>
                        <p-sidebar-panel>
                            <p-sidebar-header>
                                <div
                                    class="app-brand"
                                    role="button"
                                    tabindex="0"
                                    aria-label="Expand navigation"
                                    (click)="onLogoClick()"
                                    (keydown.enter)="onLogoClick()"
                                    (keydown.space)="onLogoClick(); $event.preventDefault()"
                                >
                                    <span class="app-brand-mark" aria-hidden="true">
                                        <span></span>
                                        <span></span>
                                        <span></span>
                                    </span>
                                    <span class="app-brand-name">BandWidth</span>
                                    <button
                                        pButton
                                        pSidebarTrigger
                                        target="nav"
                                        severity="secondary"
                                        text
                                        size="small"
                                        class="sidebar-toggle"
                                        aria-label="Toggle navigation"
                                        (click)="$event.stopPropagation()"
                                    >
                                        <svg data-p-icon="sidebar"></svg>
                                    </button>
                                </div>
                            </p-sidebar-header>
                            <p-sidebar-content>
                                @for (group of navigation; track group.label) {
                                    <p-sidebar-group>
                                        <p-sidebar-group-label>{{ group.label }}</p-sidebar-group-label>
                                        <p-sidebar-group-content>
                                            <p-sidebar-menu>
                                                @for (item of group.items; track item.route) {
                                                    <p-sidebar-menu-item>
                                                        <button
                                                            pSidebarMenuButton
                                                            [routerLink]="item.route"
                                                            routerLinkActive
                                                            #itemActive="routerLinkActive"
                                                            [routerLinkActiveOptions]="{ exact: true }"
                                                            [isActive]="itemActive.isActive"
                                                        >
                                                            <svg [pIcon]="item.icon"></svg>
                                                            <span>{{ item.label }}</span>
                                                        </button>
                                                    </p-sidebar-menu-item>
                                                }
                                            </p-sidebar-menu>
                                        </p-sidebar-group-content>
                                    </p-sidebar-group>
                                }
                            </p-sidebar-content>
                            <p-sidebar-footer>
                                <p-sidebar-menu>
                                    <p-sidebar-menu-item>
                                        <button pSidebarMenuButton (click)="onClickLogout()">
                                            <svg data-p-icon="sign-out"></svg>
                                            <span>Logout</span>
                                        </button>
                                    </p-sidebar-menu-item>
                                </p-sidebar-menu>
                            </p-sidebar-footer>
                        </p-sidebar-panel>
                    </p-sidebar-aside>
                </p-sidebar>
                <p-sidebar-main>
                    <header class="top-navbar">
                        <div class="navbar-start">
                            @if (isMobile()) {
                                <button
                                    pButton
                                    pSidebarTrigger
                                    target="nav"
                                    severity="secondary"
                                    text
                                    class="mobile-logo-toggle"
                                    aria-label="Open navigation"
                                >
                                    <span class="mobile-brand-mark" aria-hidden="true">
                                        <span></span>
                                        <span></span>
                                        <span></span>
                                    </span>
                                </button>
                            }
                            <span class="page-title">{{ currentPageTitle() }}</span>
                        </div>
                        <div class="navbar-end">
                            <span class="user-avatar" aria-label="Current user">{{ userInitials }}</span>
                        </div>
                    </header>
                    <router-outlet />
                </p-sidebar-main>
                
            </p-sidebar-layout>
        </div>
